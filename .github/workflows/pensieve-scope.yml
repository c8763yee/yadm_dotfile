name: Agent scope checks

on:
  push:
    paths:
      - '.config/yadm/bootstrap.d/30-user'
      - '.config/yadm/bootstrap.d/34-antigravity'
      - '.config/yadm/bootstrap.d/35-mcp'
      - '.config/yadm/lib/sync-antigravity-mcp.sh'
      - '.config/yadm/templates/antigravity-cli-settings.json'
      - '.config/agents/AGENTS.md'
      - '.config/agents/skills/**'
      - '.config/yadm/agent/**'
      - '.config/yadm/verify/**'
      - '.config/yadm/lib/install-agent-harness.sh'
      - 'tests/test-harness-scope.sh'
      - '.codex/AGENTS.md'
      - '.gitignore'
      - 'tests/test-antigravity-scope.sh'
      - '.config/yadm/lib/install-pensieve.sh'
      - '.local/bin/pensieve-init'
      - '.claude/settings.json'
      - 'tests/test-pensieve-scope.sh'
      - '.github/workflows/pensieve-scope.yml'
  pull_request:
    paths:
      - '.config/yadm/bootstrap.d/30-user'
      - '.config/yadm/bootstrap.d/34-antigravity'
      - '.config/yadm/bootstrap.d/35-mcp'
      - '.config/yadm/lib/sync-antigravity-mcp.sh'
      - '.config/yadm/templates/antigravity-cli-settings.json'
      - '.config/agents/AGENTS.md'
      - '.config/agents/skills/**'
      - '.config/yadm/agent/**'
      - '.config/yadm/verify/**'
      - '.config/yadm/lib/install-agent-harness.sh'
      - 'tests/test-harness-scope.sh'
      - '.codex/AGENTS.md'
      - '.gitignore'
      - 'tests/test-antigravity-scope.sh'
      - '.config/yadm/lib/install-pensieve.sh'
      - '.local/bin/pensieve-init'
      - '.claude/settings.json'
      - 'tests/test-pensieve-scope.sh'
      - '.github/workflows/pensieve-scope.yml'

jobs:
  scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test-harness-scope.sh
      - run: bash tests/test-pensieve-scope.sh
      - run: bash tests/test-antigravity-scope.sh
